name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *' # Roda a cada 3 dias ao meio-dia UTC
  workflow_dispatch: # Permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase with a SELECT
        run: |
          curl --fail --silent --show-error \
            -X GET "https://osehogdmexhsjijilxuk.supabase.co/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
          echo "✅ Supabase pinged successfully."
