# Mantém o projeto Supabase (plano gratuito) ativo: projetos sem uso por 1 semana são pausados.
# Chama a função pública keepalive() a cada 3 dias usando só a chave PÚBLICA (publishable).
#
# Configurar uma vez em Settings > Secrets and variables > Actions:
#   SUPABASE_URL                 ex.: https://xxxxxxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY     a chave sb_publishable_... (nunca a secret/service_role)
#
# Atenção: em repositório público, o GitHub desativa workflows agendados após 60 dias
# sem atividade no repositório (avisa por e-mail; reativar é um clique em Actions).
name: Supabase keepalive

on:
  schedule:
    - cron: '17 11 */3 * *' # a cada 3 dias, 08:17 em Brasília
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY"
            exit 1
          fi
          response=$(curl --silent --show-error --fail-with-body --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Resposta: $response"
          [ "$response" = '"ok"' ] || { echo "::error::Resposta inesperada"; exit 1; }
